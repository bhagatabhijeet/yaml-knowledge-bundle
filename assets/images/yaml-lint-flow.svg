<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7cbd4"/>
    </marker>
  </defs>

  <rect width="1000" height="230" fill="#ffffff" stroke="#e3e6ea" rx="14"/>
  <text x="40" y="40" font-size="20" font-weight="bold" font-family="Arial" fill="#1a1a2e">Catch mistakes before they ship</text>

  <g font-family="Arial">
    <!-- write -->
    <rect x="40" y="70" width="190" height="110" fill="#f6f8fa" stroke="#e1e4e8" rx="8"/>
    <text x="62" y="100" font-size="30" text-anchor="middle" dx="30">&#9997;&#65039;</text>
    <text x="60" y="140" font-size="13" font-weight="bold" fill="#1a1a2e">Write YAML</text>
    <text x="56" y="160" font-size="12" fill="#5a5f68">config.yaml</text>

    <line x1="238" y1="125" x2="278" y2="125" stroke="#c7cbd4" stroke-width="2" marker-end="url(#arrow3)"/>

    <!-- run yamllint -->
    <rect x="280" y="70" width="190" height="110" fill="#f2f6ff" stroke="#c9d8ff" rx="8"/>
    <text x="330" y="100" font-family="Consolas, monospace" font-size="13" fill="#4638c2">$ yamllint .</text>
    <text x="300" y="140" font-size="13" font-weight="bold" fill="#1a1a2e">Run yamllint</text>
    <text x="296" y="160" font-size="12" fill="#5a5f68">checks style &amp; syntax</text>

    <line x1="478" y1="125" x2="518" y2="125" stroke="#c7cbd4" stroke-width="2" marker-end="url(#arrow3)"/>

    <!-- fail branch -->
    <rect x="520" y="70" width="200" height="50" fill="#fff0ee" stroke="#ffc9c2" rx="8"/>
    <text x="536" y="100" font-size="13" fill="#cf222e" font-weight="bold">&#10060; line 12: bad indent</text>

    <line x1="620" y1="120" x2="620" y2="150" stroke="#c7cbd4" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="630" y="145" font-size="12" fill="#7a7f89">fix it</text>
    <line x1="600" y1="160" x2="330" y2="160" stroke="#c7cbd4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>

    <!-- pass branch -->
    <rect x="520" y="140" width="200" height="50" fill="#f0fbf8" stroke="#bfe9e1" rx="8"/>
    <text x="536" y="170" font-size="13" fill="#1c8a7b" font-weight="bold">&#9989; no problems found</text>

    <line x1="722" y1="165" x2="762" y2="165" stroke="#c7cbd4" stroke-width="2" marker-end="url(#arrow3)"/>

    <!-- ship -->
    <rect x="764" y="130" width="196" height="70" fill="#f0fbf8" stroke="#bfe9e1" rx="8"/>
    <text x="800" y="160" font-size="26" text-anchor="middle" dx="30">&#128640;</text>
    <text x="838" y="172" font-size="13" font-weight="bold" fill="#1c8a7b">Ship with</text>
    <text x="838" y="188" font-size="13" font-weight="bold" fill="#1c8a7b">confidence</text>
  </g>
</svg>
