<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330">
  <defs>
    <linearGradient id="cmpAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a5c"/>
      <stop offset="50%" stop-color="#6a5cff"/>
      <stop offset="100%" stop-color="#2fb8a6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="330" fill="#ffffff" stroke="#e3e6ea" rx="14"/>
  <rect x="0" y="0" width="1000" height="8" fill="url(#cmpAccent)" rx="4"/>

  <text x="30" y="46" font-size="22" font-weight="bold" font-family="Arial" fill="#1a1a2e">XML vs JSON vs YAML — quick look</text>
  <text x="30" y="68" font-size="14" font-family="Arial" fill="#7a7f89">Same data, three ways to write it</text>

  <!-- XML card -->
  <g font-family="Arial">
    <rect x="30" y="90" width="290" height="210" fill="#fff5f2" stroke="#ffd6c4" rx="10"/>
    <circle cx="55" cy="118" r="10" fill="#ff8a5c"/>
    <text x="75" y="123" font-size="16" font-weight="bold" fill="#c65a30">XML</text>
    <text x="50" y="150" font-size="12" fill="#8a5a45">Verbose &#183; tag-based &#183; 1990s</text>
    <rect x="50" y="164" width="240" height="94" fill="#ffffff" stroke="#ffe1d2" rx="6"/>
    <text x="60" y="184" font-family="Consolas, monospace" font-size="12" fill="#5a4238">&lt;person&gt;</text>
    <text x="72" y="202" font-family="Consolas, monospace" font-size="12" fill="#5a4238">&lt;name&gt;Alice&lt;/name&gt;</text>
    <text x="72" y="220" font-family="Consolas, monospace" font-size="12" fill="#5a4238">&lt;age&gt;30&lt;/age&gt;</text>
    <text x="60" y="238" font-family="Consolas, monospace" font-size="12" fill="#5a4238">&lt;/person&gt;</text>
    <text x="50" y="285" font-size="12" fill="#c65a30">Readability: &#9733;&#9734;&#9734;</text>
  </g>

  <!-- JSON card -->
  <g font-family="Arial">
    <rect x="355" y="90" width="290" height="210" fill="#f2f6ff" stroke="#c9d8ff" rx="10"/>
    <circle cx="380" cy="118" r="10" fill="#6a5cff"/>
    <text x="400" y="123" font-size="16" font-weight="bold" fill="#4638c2">JSON</text>
    <text x="375" y="150" font-size="12" fill="#5a5a8a">Compact &#183; strict &#183; 2000s</text>
    <rect x="375" y="164" width="240" height="94" fill="#ffffff" stroke="#dbe4ff" rx="6"/>
    <text x="385" y="184" font-family="Consolas, monospace" font-size="12" fill="#333a5c">{ "person": {</text>
    <text x="397" y="202" font-family="Consolas, monospace" font-size="12" fill="#333a5c">"name": "Alice",</text>
    <text x="397" y="220" font-family="Consolas, monospace" font-size="12" fill="#333a5c">"age": 30</text>
    <text x="385" y="238" font-family="Consolas, monospace" font-size="12" fill="#333a5c">} }</text>
    <text x="375" y="285" font-size="12" fill="#4638c2">Readability: &#9733;&#9733;&#9734;</text>
  </g>

  <!-- YAML card -->
  <g font-family="Arial">
    <rect x="680" y="90" width="290" height="210" fill="#f0fbf8" stroke="#bfe9e1" rx="10"/>
    <circle cx="705" cy="118" r="10" fill="#2fb8a6"/>
    <text x="725" y="123" font-size="16" font-weight="bold" fill="#1c8a7b">YAML</text>
    <text x="700" y="150" font-size="12" fill="#4c7a72">Minimal &#183; human-first &#183; 2001+</text>
    <rect x="700" y="164" width="240" height="94" fill="#ffffff" stroke="#d3f0e8" rx="6"/>
    <text x="710" y="184" font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">person:</text>
    <text x="722" y="202" font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">name: Alice</text>
    <text x="722" y="220" font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">age: 30</text>
    <text x="700" y="285" font-size="12" fill="#1c8a7b">Readability: &#9733;&#9733;&#9733;</text>
  </g>
</svg>
