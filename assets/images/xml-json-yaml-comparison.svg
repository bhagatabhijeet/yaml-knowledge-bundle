<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260">
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-family="Arial" fill="#111">XML vs JSON vs YAML — quick look</text>
  <g font-family="Arial" font-size="13" fill="#222">
    <rect x="30" y="56" width="260" height="180" fill="#f6f8fa" stroke="#e1e4e8" rx="6"/>
    <text x="50" y="82" font-weight="700">XML</text>
    <text x="50" y="105">Verbose, tag-based</text>
    <text x="50" y="125">Example:</text>
    <text x="50" y="145" font-family="monospace">&lt;person&gt; ... &lt;/person&gt;</text>

    <rect x="330" y="56" width="260" height="180" fill="#fff7e6" stroke="#f0e5c9" rx="6"/>
    <text x="350" y="82" font-weight="700">JSON</text>
    <text x="350" y="105">Compact, strict</text>
    <text x="350" y="125">Example:</text>
    <text x="350" y="145" font-family="monospace">{" + '"person": {...}' + "}</text>

    <rect x="630" y="56" width="240" height="180" fill="#ecffef" stroke="#d9f0dc" rx="6"/>
    <text x="650" y="82" font-weight="700">YAML</text>
    <text x="650" y="105">Human-friendly, indented</text>
    <text x="650" y="125">Example:</text>
    <text x="650" y="145" font-family="monospace">person:\n  name: Alice</text>
  </g>
</svg>
