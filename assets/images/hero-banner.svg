<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="coverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1440"/>
      <stop offset="55%" stop-color="#241a5e"/>
      <stop offset="100%" stop-color="#123d40"/>
    </linearGradient>
    <linearGradient id="coverAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a5c"/>
      <stop offset="50%" stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#2fe0c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cover background -->
  <rect width="1200" height="480" fill="url(#coverBg)" rx="18"/>
  <rect width="1200" height="480" fill="url(#glow)" rx="18"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#coverAccent)" rx="5"/>

  <!-- faint decorative yaml snippet, background texture -->
  <g font-family="Consolas, Menlo, monospace" font-size="20" fill="#ffffff" opacity="0.06">
    <text x="60" y="120">book:</text>
    <text x="100" y="150">title: YAML Knowledge Bundle</text>
    <text x="100" y="180">level: beginner</text>
    <text x="100" y="210">chapters: 6</text>
    <text x="100" y="240">format: [xml, json, yaml]</text>
    <text x="60" y="270">reads_in: "~11 minutes"</text>
  </g>

  <!-- corner ribbon -->
  <g font-family="Arial" font-weight="bold">
    <rect x="920" y="36" width="230" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="945" y="58" font-size="14" fill="#ffe9de" letter-spacing="1">BEGINNER FRIENDLY</text>
  </g>

  <!-- main title block, centered -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="210" font-size="30" fill="#c9c3ff" letter-spacing="6" font-weight="600">THE YAML KNOWLEDGE BUNDLE</text>

    <text x="600" y="300" font-size="88" font-weight="bold" fill="#ffffff">YAML in Minutes</text>

    <rect x="470" y="322" width="260" height="6" rx="3" fill="url(#coverAccent)"/>

    <text x="600" y="365" font-size="20" fill="#d9d6f5">Not hours of tutorials. Six short lessons, real examples.</text>
  </g>

  <!-- stat pills -->
  <g font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="355" y="400" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="420" y="425" fill="#ffffff">6 lessons</text>

    <rect x="505" y="400" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="580" y="425" fill="#ffffff">~11 minutes</text>

    <rect x="675" y="400" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="760" y="425" fill="#ffffff">beginner-first</text>
  </g>
</svg>
