<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a5cff"/>
      <stop offset="100%" stop-color="#2fb8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#ffffff" stroke="#e3e6ea" rx="14"/>
  <rect x="0" y="0" width="10" height="300" fill="url(#accent)" rx="6"/>

  <!-- Left: headline -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="95" font-size="44" font-weight="bold" fill="#1a1a2e">YAML in Minutes <tspan font-size="34">⚡</tspan></text>
    <text x="50" y="130" font-size="18" fill="#4a4f5a">Not hours of tutorials. 6 short lessons, real examples, ~11 minutes total.</text>

    <!-- badges -->
    <g font-size="13" fill="#ffffff">
      <rect x="50" y="155" width="88" height="28" rx="14" fill="#6a5cff"/>
      <text x="64" y="173">6 lessons</text>

      <rect x="148" y="155" width="96" height="28" rx="14" fill="#2fb8a6"/>
      <text x="162" y="173">~11 minutes</text>

      <rect x="254" y="155" width="130" height="28" rx="14" fill="#ff8a5c"/>
      <text x="268" y="173">runnable examples</text>
    </g>

    <text x="50" y="220" font-size="14" fill="#7a7f89">Kubernetes • GitHub Actions • Ansible • Docker Compose • CI pipelines</text>
  </g>

  <!-- Right: JSON -> YAML mini comparison -->
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <rect x="740" y="55" width="190" height="130" rx="8" fill="#f6f8fa" stroke="#d7dbe0"/>
    <text x="756" y="75" fill="#9aa0a8">JSON</text>
    <text x="756" y="98" fill="#333">{"person": {</text>
    <text x="770" y="118" fill="#333">"name": "Alice",</text>
    <text x="770" y="138" fill="#333">"age": 30</text>
    <text x="756" y="158" fill="#333">}}</text>

    <text x="950" y="120" font-family="Arial" font-size="26" fill="#6a5cff">→</text>

    <rect x="990" y="55" width="170" height="130" rx="8" fill="#f1fbf9" stroke="#bfe9e1"/>
    <text x="1006" y="75" fill="#2fb8a6" font-family="Arial">YAML</text>
    <text x="1006" y="98" fill="#1a1a2e">person:</text>
    <text x="1018" y="118" fill="#1a1a2e">name: Alice</text>
    <text x="1018" y="138" fill="#1a1a2e">age: 30</text>
  </g>
  <text x="990" y="205" font-family="Arial" font-size="13" fill="#7a7f89">same data, way less noise</text>
</svg>
